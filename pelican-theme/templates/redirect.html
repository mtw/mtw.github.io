{#- Minimal no-index redirect page. Used by pages that must keep their URL but must not
    show content yet (metadata: ":template: redirect" and ":redirect_to: <url>"). -#}
{% set target = (page.redirect_to or '/')|format_siteurl %}
<!DOCTYPE html>
<html lang="{{ DEFAULT_LANG }}">
<head>
  <meta charset="UTF-8" />
  <title>{{ SITENAME|e }}</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta http-equiv="refresh" content="0; url={{ target|e }}" />
  <link rel="canonical" href="{{ target|e }}" />
</head>
<body>
  <p>Redirecting to <a href="{{ target|e }}">{{ target|e }}</a>.</p>
</body>
</html>
