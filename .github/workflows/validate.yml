name: Validate

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  pelican:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install ".[dev,test]"

      - name: Build site
        working-directory: Pelican
        run: pelican content -o output -s pelicanconf.py

      - name: Smoke-check generated site
        run: |
          test -f Pelican/output/index.html
          test -f Pelican/output/sitemap.xml
          test -f Pelican/output/robots.txt
          test -f Pelican/output/CNAME
          test -f Pelican/output/static/m-mtw.css
          test -d Pelican/output/static

      # The suite builds the site with publishconf.py (the deploy configuration), checks
      # every URL from the live sitemap still resolves, validates internal links and
      # content metadata, and exercises the publish-time minification.
      - name: Run test suite
        run: python -m pytest -q
